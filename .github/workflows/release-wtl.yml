name: Release WTL build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check out WTL headers
        uses: actions/checkout@v4.2.2
        with:
          repository: Win32-WTL/WTL
          ref: 065ef5597383c1231bd4892cf8e94331b29bdb97
          path: vendor/WTL

      - name: Install build dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install boost-headers boost-json lua libpng expat wxwidgets --triplet x64-windows-static

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DWTL_INCLUDE_DIR=$env:GITHUB_WORKSPACE/vendor/WTL/Include" `
            -DBUNGALOW_UI_BACKEND=wtl
          cmake --build build --config Release
          cmake --install build --config Release --prefix package
          Copy-Item resources package/resources -Recurse
          Compress-Archive -Path package/* -DestinationPath bungalow-native-wtl-windows-x64.zip

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bungalow-native-wtl-windows-x64
          path: bungalow-native-wtl-windows-x64.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: bungalow-native-wtl-windows-x64.zip
